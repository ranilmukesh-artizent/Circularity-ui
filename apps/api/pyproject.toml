[project]
name = "circularity-di"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
# docs/agents/plans/01b-refactor.md, step C3. Run from apps/api: `mypy` (version pinned in requirements-dev.lock).
# Every module: bodies of unannotated functions are checked too. The core modules below: strict.
python_version = "3.12"
files = ["di"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
# `strict = true` is global-only in mypy, so the flags it turns on are listed here.
module = [
  "di.config",
  "di.db",
  "di.auth",
  "di.jobs",
  "di.worker",
  "di.state",
  "di.clock",
  "di.golden",
  "di.stream",
  "di.connectors.base",
  "di.actions.pipeline",
  "di.actions.registry",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
no_implicit_reexport = true

[tool.ruff]
# Shared settings (line length, target, rule selection) live in the repo-root ruff.toml.
extend = "../../ruff.toml"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body", "fastapi.Header"]
