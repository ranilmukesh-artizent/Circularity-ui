[project]
name = "circularity-di"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
# Shared settings (line length, target, rule selection) live in the repo-root ruff.toml.
extend = "../../ruff.toml"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body", "fastapi.Header"]
