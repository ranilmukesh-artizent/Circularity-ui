<text x="800.0" y="376" text-anchor="middle" font-size="13" font-weight="700" fill="#FFDD00">Returned assets</text>
<rect x="964" y="150" width="268" height="236" fill="#FFFFFF" stroke="#141414" stroke-width="1.6"/>
<text x="976" y="174" font-size="13.5" font-weight="700" fill="#141414">ENTERPRISE SYSTEMS</text>
<text x="976" y="206" font-size="17.5" font-weight="700" fill="#141414">1. Supply evidence</text>
<circle cx="981" cy="229.5" r="2.2" fill="#141414"/>
<text x="990" y="234" font-size="13.5" fill="#141414">EAM: condition, Grade B</text>
<circle cx="981" cy="247.5" r="2.2" fill="#141414"/>
<text x="990" y="252" font-size="13.5" fill="#141414">QMS: certified 24 months</text>
<circle cx="981" cy="265.5" r="2.2" fill="#141414"/>
<text x="990" y="270" font-size="13.5" fill="#141414">ERP / WMS / PLM: history, return</text>
<text x="990" y="288" font-size="13.5" fill="#141414">history, specs</text>
<rect x="964" y="356" width="268" height="30" fill="#141414"/>
<text x="1098.0" y="376" text-anchor="middle" font-size="13" font-weight="700" fill="#FFDD00">Asset intelligence · what we know</text>
<rect x="1262" y="150" width="268" height="236" fill="#FFDD00" stroke="#141414" stroke-width="1.6"/>
<text x="1274" y="174" font-size="13.5" font-weight="700" fill="#141414">CIRCULARITY</text>
<text x="1274" y="206" font-size="17.5" font-weight="700" fill="#141414">2–3. Build alternatives</text>
<text x="1274" y="228" font-size="17.5" font-weight="700" fill="#141414">&amp; predict outcomes</text>
<circle cx="1279" cy="251.5" r="2.2" fill="#141414"/>
<text x="1288" y="256" font-size="13.5" fill="#141414">Eligible treatments and gates</text>
<circle cx="1279" cy="269.5" r="2.2" fill="#141414"/>
<text x="1288" y="274" font-size="13.5" fill="#141414">Remaining life 30–40 months</text>
<circle cx="1279" cy="287.5" r="2.2" fill="#141414"/>
<text x="1288" y="292" font-size="13.5" fill="#141414">Value by route: Redeploy $9,600</text>
<rect x="1262" y="356" width="268" height="30" fill="#141414"/>
<text x="1396.0" y="376" text-anchor="middle" font-size="13" font-weight="700" fill="#FFDD00">Asset intelligence · what we predict</text>
<rect x="1262" y="500" width="268" height="236" fill="#FFDD00" stroke="#141414" stroke-width="1.6"/>
<text x="1274" y="524" font-size="13.5" font-weight="700" fill="#141414">CIRCULARITY</text>
<text x="1274" y="556" font-size="17.5" font-weight="700" fill="#141414">4. Optimize plan</text>
<circle cx="1279" cy="579.5" r="2.2" fill="#141414"/>
<text x="1288" y="584" font-size="13.5" fill="#141414">Recommended outcome, why,</text>
<text x="1288" y="602" font-size="13.5" fill="#141414">confidence</text>
<circle cx="1279" cy="615.5" r="2.2" fill="#141414"/>
<text x="1288" y="620" font-size="13.5" fill="#141414">What-if and pathways compared</text>
<circle cx="1279" cy="633.5" r="2.2" fill="#141414"/>
<text x="1288" y="638" font-size="13.5" fill="#141414">Plan: redeploy to Site 3</text>
<text x="1288" y="656" font-size="13.5" fill="#141414">(SO-48102)</text>
<rect x="1262" y="706" width="268" height="30" fill="#141414"/>
<text x="1396.0" y="726" text-anchor="middle" font-size="13" font-weight="700" fill="#FFDD00">Treatment Intelligence · steps 2–4</text>
<rect x="964" y="500" width="268" height="236" fill="#FFFFFF" stroke="#141414" stroke-width="1.6"/>
<text x="976" y="524" font-size="13.5" font-weight="700" fill="#141414">HUMAN IN THE LOOP</text>
<text x="976" y="556" font-size="17.5" font-weight="700" fill="#141414">5. Plan approval</text>
<circle cx="981" cy="579.5" r="2.2" fill="#141414"/>
