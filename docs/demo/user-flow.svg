<text x="380" y="150" font-size="12.5" font-weight="700" fill="#141414">END USER · PLANNER</text>
<text x="380" y="174" font-size="17" font-weight="700" fill="#141414">Returned assets</text>
<text x="380" y="194" font-size="13" fill="#141414">What has come back; pick one</text>
<text x="380" y="211" font-size="13" fill="#141414">asset: RT-1048, Start here</text>
<rect x="368" y="234" width="268" height="26" fill="#141414"/>
<text x="502.0" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFDD00">Returned assets</text>
