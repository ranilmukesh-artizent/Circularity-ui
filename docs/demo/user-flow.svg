<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080" role="img" aria-labelledby="t d" font-family="Arial,'Segoe UI',Helvetica,sans-serif">
<title id="t">Circularity user flow, version 2</title>
<desc id="d">How a user moves through the Circularity demo for one returned asset, RT-1048: sign in, open Returned assets and pick the asset, then follow journey steps 1 to 10, numbered and named like the Product Owner's Typical User Journey. The Exceptions dashboard is a side dashboard for Executives and Planners, not a step in the journey. Asset Intelligence fills in its commercial value as the steps run. Synthetic demo data.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#141414"/></marker></defs>
<rect width="1600" height="1080" fill="#EEE8E1"/>
<text x="70" y="64" font-size="38" font-weight="700" fill="#141414">User Flow</text>
<text x="70" y="98" font-size="17" fill="#4B4541">Sign in, pick one returned asset, follow its journey. RT-1048 (Voltara V4 motor, Customer A, Warehouse 1). Steps match the Typical User Journey.</text>
