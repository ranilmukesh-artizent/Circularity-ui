<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Arial,'Segoe UI',Helvetica,sans-serif">
<title id="t">Circularity user flow, as built</title>
<desc id="d">How a user moves through the current Circularity demo for one returned asset, RT-1048: sign in, the senior manager notifies the owner from Exceptions by warehouse, the planner opens Returned assets, then the asset moves through journey boxes 1 to 10 from supply evidence to reconcile and learn. Numbers match the Product Owner's Typical User Journey. Synthetic demo data.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#141414"/></marker></defs>
<rect width="1600" height="900" fill="#EEE8E1"/>
<text x="70" y="70" font-size="38" font-weight="700" fill="#141414">User Flow (as built)</text>
<text x="70" y="106" font-size="17" fill="#4B4541">One returned asset, RT-1048 (Voltara V4 motor, Customer A, Warehouse 1), from sign-in to the reconciled outcome. Numbers match the Typical User Journey.</text>
