<path d="M420 260 L420 280 L204 280 L204 298" fill="none" stroke="#141414" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="312" y="274" text-anchor="middle" font-size="13" font-style="italic" fill="#4B4541">Open the asset · step 1</text>
<rect x="740" y="128" width="790" height="132" fill="#FFFFFF" stroke="#141414" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="752" y="150" font-size="12.5" font-weight="700" fill="#141414">SIDE DASHBOARD · EXECUTIVE, PLANNER</text>
<text x="752" y="174" font-size="17" font-weight="700" fill="#141414">Exceptions dashboard (not a journey step)</text>
<text x="752" y="194" font-size="13" fill="#141414">A gate failure, missing evidence, a delayed approval or a capacity problem in steps 1–5</text>
<text x="752" y="211" font-size="13" fill="#141414">surfaces here. Notify owner sends it to the person who acts, who opens that asset’s journey.</text>
<rect x="740" y="234" width="790" height="26" fill="#141414"/>
<text x="1135.0" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFDD00">Executive Command Center · exceptions by warehouse</text>
