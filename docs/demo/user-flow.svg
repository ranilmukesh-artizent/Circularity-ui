<text x="990" y="742" font-size="13.5" fill="#141414">EAM: refurbishment work order</text>
<text x="990" y="760" font-size="13.5" fill="#141414">(WO)</text>
<rect x="964" y="846" width="268" height="30" fill="#141414"/>
<text x="1098.0" y="866" text-anchor="middle" font-size="13" font-weight="700" fill="#FFDD00">Handoff rows 1–2</text>
<rect x="666" y="640" width="268" height="236" fill="#FFFFFF" stroke="#141414" stroke-width="1.6"/>
<text x="678" y="664" font-size="13.5" font-weight="700" fill="#141414">ENTERPRISE SYSTEMS</text>
<text x="678" y="696" font-size="17.5" font-weight="700" fill="#141414">8. Repair &amp; certify</text>
<circle cx="683" cy="719.5" r="2.2" fill="#141414"/>
<text x="692" y="724" font-size="13.5" fill="#141414">Perform repairs and final tests</text>
<circle cx="683" cy="737.5" r="2.2" fill="#141414"/>
<text x="692" y="742" font-size="13.5" fill="#141414">Record results and certification</text>
<text x="692" y="760" font-size="13.5" fill="#141414">in EAM / quality systems</text>
<rect x="666" y="846" width="268" height="30" fill="#141414"/>
<text x="800.0" y="866" text-anchor="middle" font-size="13" font-weight="700" fill="#FFDD00">Handoff row 2</text>
<rect x="368" y="640" width="268" height="236" fill="#FFFFFF" stroke="#141414" stroke-width="1.6"/>
<text x="380" y="664" font-size="13.5" font-weight="700" fill="#141414">ENTERPRISE SYSTEMS</text>
<text x="380" y="696" font-size="17.5" font-weight="700" fill="#141414">9. Action &amp; return</text>
<text x="380" y="718" font-size="17.5" font-weight="700" fill="#141414">outcome</text>
<circle cx="385" cy="741.5" r="2.2" fill="#141414"/>
<text x="394" y="746" font-size="13.5" fill="#141414">WMS: transfer to Site 3</text>
<circle cx="385" cy="759.5" r="2.2" fill="#141414"/>
<text x="394" y="764" font-size="13.5" fill="#141414">ERP: order fulfilled; status,</text>
<text x="394" y="782" font-size="13.5" fill="#141414">receipts and actual costs sent</text>
<text x="394" y="800" font-size="13.5" fill="#141414">back</text>
<rect x="368" y="846" width="268" height="30" fill="#141414"/>
<text x="502.0" y="866" text-anchor="middle" font-size="13" font-weight="700" fill="#FFDD00">Handoff rows 3–4</text>
<rect x="70" y="640" width="268" height="236" fill="#FFDD00" stroke="#141414" stroke-width="1.6"/>
<text x="82" y="664" font-size="13.5" font-weight="700" fill="#141414">CIRCULARITY</text>
<text x="82" y="696" font-size="17.5" font-weight="700" fill="#141414">10. Reconcile &amp; learn</text>
<circle cx="87" cy="719.5" r="2.2" fill="#141414"/>
<text x="96" y="724" font-size="13.5" fill="#141414">Link actuals to the decision and</text>
