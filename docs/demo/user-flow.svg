<circle cx="87" cy="265.5" r="2.2" fill="#141414"/>
<text x="96" y="270" font-size="13.5" fill="#141414">Lands on their own home page, no</text>
<text x="96" y="288" font-size="13.5" fill="#141414">role picker</text>
