<rect x="70" y="300" width="268" height="236" fill="#FFFFFF" stroke="#141414" stroke-width="1.6"/>
<text x="82" y="324" font-size="13.5" font-weight="700" fill="#141414">ENTERPRISE SYSTEMS</text>
<text x="82" y="356" font-size="17.5" font-weight="700" fill="#141414">1. Supply evidence</text>
<circle cx="87" cy="379.5" r="2.2" fill="#141414"/>
<text x="96" y="384" font-size="13.5" fill="#141414">EAM: inspection and history</text>
<text x="96" y="402" font-size="13.5" fill="#141414">(Grade B)</text>
<circle cx="87" cy="415.5" r="2.2" fill="#141414"/>
<text x="96" y="420" font-size="13.5" fill="#141414">PLM / quality: eligibility (QMS</text>
<text x="96" y="438" font-size="13.5" fill="#141414">certified 24 months)</text>
<circle cx="87" cy="451.5" r="2.2" fill="#141414"/>
<text x="96" y="456" font-size="13.5" fill="#141414">ERP / WMS: cost and stock</text>
<rect x="70" y="506" width="268" height="30" fill="#141414"/>
<text x="204.0" y="526" text-anchor="middle" font-size="13" font-weight="700" fill="#FFDD00">Asset Intelligence · what we know</text>
<rect x="368" y="300" width="268" height="236" fill="#FFDD00" stroke="#141414" stroke-width="1.6"/>
<text x="380" y="324" font-size="13.5" font-weight="700" fill="#141414">CIRCULARITY</text>
<text x="380" y="356" font-size="17.5" font-weight="700" fill="#141414">2. Build alternatives</text>
<circle cx="385" cy="379.5" r="2.2" fill="#141414"/>
<text x="394" y="384" font-size="13.5" fill="#141414">Retrieve and link evidence</text>
<circle cx="385" cy="397.5" r="2.2" fill="#141414"/>
<text x="394" y="402" font-size="13.5" fill="#141414">Check internal and external</text>
<text x="394" y="420" font-size="13.5" fill="#141414">demand (SO-48102 at Site 3)</text>
<circle cx="385" cy="433.5" r="2.2" fill="#141414"/>
<text x="394" y="438" font-size="13.5" fill="#141414">6 of 7 routes eligible</text>
<rect x="368" y="506" width="268" height="30" fill="#141414"/>
<text x="502.0" y="526" text-anchor="middle" font-size="13" font-weight="700" fill="#FFDD00">Asset Intelligence · eligibility, demand</text>
<rect x="666" y="300" width="268" height="236" fill="#FFDD00" stroke="#141414" stroke-width="1.6"/>
<text x="678" y="324" font-size="13.5" font-weight="700" fill="#141414">CIRCULARITY</text>
<text x="678" y="356" font-size="17.5" font-weight="700" fill="#141414">3. Predict outcomes</text>
<circle cx="683" cy="379.5" r="2.2" fill="#141414"/>
<text x="692" y="384" font-size="13.5" fill="#141414">Predict price, sale likelihood,</text>
<text x="692" y="402" font-size="13.5" fill="#141414">timing</text>
<circle cx="683" cy="415.5" r="2.2" fill="#141414"/>
<text x="692" y="420" font-size="13.5" fill="#141414">Repair cost and success, claims</text>
<text x="692" y="438" font-size="13.5" fill="#141414">exposure</text>
<circle cx="683" cy="451.5" r="2.2" fill="#141414"/>
<text x="692" y="456" font-size="13.5" fill="#141414">Life 30–40 months; value by route</text>
<rect x="666" y="506" width="268" height="30" fill="#141414"/>
<text x="800.0" y="526" text-anchor="middle" font-size="13" font-weight="700" fill="#FFDD00">Asset Intelligence · life and value</text>
<rect x="964" y="300" width="268" height="236" fill="#FFDD00" stroke="#141414" stroke-width="1.6"/>
<text x="976" y="324" font-size="13.5" font-weight="700" fill="#141414">CIRCULARITY</text>
<text x="976" y="356" font-size="17.5" font-weight="700" fill="#141414">4. Optimize plan</text>
<circle cx="981" cy="379.5" r="2.2" fill="#141414"/>
<text x="990" y="384" font-size="13.5" fill="#141414">Compare net value across every</text>
<text x="990" y="402" font-size="13.5" fill="#141414">route</text>
<circle cx="981" cy="415.5" r="2.2" fill="#141414"/>
<text x="990" y="420" font-size="13.5" fill="#141414">Withheld routes shown with the</text>
<text x="990" y="438" font-size="13.5" fill="#141414">reason</text>
<circle cx="981" cy="451.5" r="2.2" fill="#141414"/>
<text x="990" y="456" font-size="13.5" fill="#141414">Recommended: Redeploy, $9,600</text>
<rect x="964" y="506" width="268" height="30" fill="#141414"/>
<text x="1098.0" y="526" text-anchor="middle" font-size="13" font-weight="700" fill="#FFDD00">Treatment Intelligence · step 2</text>
<rect x="1262" y="300" width="268" height="236" fill="#FFFFFF" stroke="#141414" stroke-width="1.6"/>
<text x="1274" y="324" font-size="13.5" font-weight="700" fill="#141414">HUMAN IN THE LOOP</text>
<text x="1274" y="356" font-size="17.5" font-weight="700" fill="#141414">5. Plan approval</text>
<circle cx="1279" cy="379.5" r="2.2" fill="#141414"/>
<text x="1288" y="384" font-size="13.5" fill="#141414">Review rationale and alternatives</text>
<circle cx="1279" cy="397.5" r="2.2" fill="#141414"/>
<text x="1288" y="402" font-size="13.5" fill="#141414">Approve, override or decline</text>
<circle cx="1279" cy="415.5" r="2.2" fill="#141414"/>
<text x="1288" y="420" font-size="13.5" fill="#141414">Spend and sale terms</text>
<rect x="1262" y="506" width="268" height="30" fill="#141414"/>
<text x="1396.0" y="526" text-anchor="middle" font-size="13" font-weight="700" fill="#FFDD00">Treatment Intelligence · step 5</text>
<rect x="1262" y="640" width="268" height="236" fill="#FFDD00" stroke="#141414" stroke-width="1.6"/>
<text x="1274" y="664" font-size="13.5" font-weight="700" fill="#141414">CIRCULARITY</text>
<text x="1274" y="696" font-size="17.5" font-weight="700" fill="#141414">6. Send instruction</text>
<circle cx="1279" cy="719.5" r="2.2" fill="#141414"/>
<text x="1288" y="724" font-size="13.5" fill="#141414">Send the approved plan to ERP,</text>
<text x="1288" y="742" font-size="13.5" fill="#141414">EAM and WMS</text>
<circle cx="1279" cy="755.5" r="2.2" fill="#141414"/>
<text x="1288" y="760" font-size="13.5" fill="#141414">Track acknowledgements</text>
<rect x="1262" y="846" width="268" height="30" fill="#141414"/>
<text x="1396.0" y="866" text-anchor="middle" font-size="13" font-weight="700" fill="#FFDD00">Step 5 · instruction</text>
<rect x="964" y="640" width="268" height="236" fill="#FFFFFF" stroke="#141414" stroke-width="1.6"/>
<text x="976" y="664" font-size="13.5" font-weight="700" fill="#141414">ENTERPRISE SYSTEMS</text>
<text x="976" y="696" font-size="17.5" font-weight="700" fill="#141414">7. Create execution work</text>
<circle cx="981" cy="719.5" r="2.2" fill="#141414"/>
<text x="990" y="724" font-size="13.5" fill="#141414">ERP: redeployment order SO-48102</text>
