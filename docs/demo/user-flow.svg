<text x="949.0" y="402" text-anchor="middle" font-size="13" font-style="italic" fill="#4B4541">Next</text>
<path d="M1098.0 150 L1098.0 134 L1396.0 134 L1396.0 148" fill="none" stroke="#141414" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="1247.0" y="128" text-anchor="middle" font-size="13" font-style="italic" fill="#4B4541">Next</text>
<path d="M1396.0 386 L1396.0 498" fill="none" stroke="#141414" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="1426.0" y="443.0" text-anchor="middle" font-size="13" font-style="italic" fill="#4B4541">Next</text>
<path d="M1396.0 736 L1396.0 758 L1098.0 758 L1098.0 738" fill="none" stroke="#141414" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="1247.0" y="774" text-anchor="middle" font-size="13" font-style="italic" fill="#4B4541">Next</text>
<path d="M1098.0 500 L1098.0 484 L800.0 484 L800.0 498" fill="none" stroke="#141414" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="949.0" y="478" text-anchor="middle" font-size="13" font-style="italic" fill="#4B4541">Approve</text>
<path d="M800.0 736 L800.0 758 L502.0 758 L502.0 738" fill="none" stroke="#141414" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="651.0" y="774" text-anchor="middle" font-size="13" font-style="italic" fill="#4B4541">Sent</text>
<path d="M502.0 500 L502.0 484 L204.0 484 L204.0 498" fill="none" stroke="#141414" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="353.0" y="478" text-anchor="middle" font-size="13" font-style="italic" fill="#4B4541">Outcome reported</text>
