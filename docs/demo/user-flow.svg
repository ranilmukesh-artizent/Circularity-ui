<text x="394" y="642" font-size="13.5" fill="#141414">Outcome reported back</text>
<rect x="368" y="706" width="268" height="30" fill="#141414"/>
<text x="502.0" y="726" text-anchor="middle" font-size="13" font-weight="700" fill="#FFDD00">Step 5 · system acknowledgements</text>
<rect x="70" y="500" width="268" height="236" fill="#FFDD00" stroke="#141414" stroke-width="1.6"/>
<text x="82" y="524" font-size="13.5" font-weight="700" fill="#141414">FINANCE · CIRCULARITY</text>
<text x="82" y="556" font-size="17.5" font-weight="700" fill="#141414">10. Reconcile &amp; learn</text>
<circle cx="87" cy="579.5" r="2.2" fill="#141414"/>
<text x="96" y="584" font-size="13.5" fill="#141414">Finance confirms the actual</text>
<text x="96" y="602" font-size="13.5" fill="#141414">outcome</text>
<circle cx="87" cy="615.5" r="2.2" fill="#141414"/>
<text x="96" y="620" font-size="13.5" fill="#141414">Predicted vs actual across</text>
<text x="96" y="638" font-size="13.5" fill="#141414">decisions</text>
<circle cx="87" cy="651.5" r="2.2" fill="#141414"/>
<text x="96" y="656" font-size="13.5" fill="#141414">Models improve for the next asset</text>
<rect x="70" y="706" width="268" height="30" fill="#141414"/>
<text x="204.0" y="726" text-anchor="middle" font-size="13" font-weight="700" fill="#FFDD00">Analytics · predicted vs actual</text>
<rect x="70" y="806" width="18" height="18" fill="#FFDD00" stroke="#141414"/><text x="96" y="820" font-size="14" fill="#141414">Circularity</text>
<rect x="200" y="806" width="18" height="18" fill="#FFFFFF" stroke="#141414"/><text x="226" y="820" font-size="14" fill="#141414">People and enterprise systems</text>
<rect x="460" y="806" width="40" height="18" fill="#141414"/><text x="508" y="820" font-size="14" fill="#141414">Screen in the app</text>
<text x="70" y="852" font-size="13" fill="#7B726D">Presenter mode switches between Planner, Approver and Finance in place. Enterprise-system steps are simulated acknowledgements. All data is synthetic.</text>
