<rect x="666" y="150" width="268" height="236" fill="#FFFFFF" stroke="#141414" stroke-width="1.6"/>
<text x="678" y="174" font-size="13.5" font-weight="700" fill="#141414">END USER · PLANNER</text>
<text x="678" y="206" font-size="17.5" font-weight="700" fill="#141414">Returned assets</text>
