<path d="M502.0 150 L502.0 134 L800.0 134 L800.0 148" fill="none" stroke="#141414" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="651.0" y="128" text-anchor="middle" font-size="13" font-style="italic" fill="#4B4541">Notify owner · Planner signs in</text>
