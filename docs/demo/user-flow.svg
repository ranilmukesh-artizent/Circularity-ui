<text x="82" y="174" font-size="17" font-weight="700" fill="#141414">Sign in</text>
<text x="82" y="194" font-size="13" fill="#141414">Work email, user ID or single</text>
<text x="82" y="211" font-size="13" fill="#141414">sign-on (simulated)</text>
<rect x="70" y="234" width="268" height="26" fill="#141414"/>
<text x="204.0" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFDD00">Sign-in form</text>
