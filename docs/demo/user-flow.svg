<text x="990" y="638" font-size="13.5" fill="#141414">Approves, overrides or declines</text>
<rect x="964" y="706" width="268" height="30" fill="#141414"/>
<text x="1098.0" y="726" text-anchor="middle" font-size="13" font-weight="700" fill="#FFDD00">Treatment Intelligence · step 5</text>
<rect x="666" y="500" width="268" height="236" fill="#FFDD00" stroke="#141414" stroke-width="1.6"/>
<text x="678" y="524" font-size="13.5" font-weight="700" fill="#141414">CIRCULARITY</text>
<text x="678" y="556" font-size="17.5" font-weight="700" fill="#141414">6. Send instruction</text>
<circle cx="683" cy="579.5" r="2.2" fill="#141414"/>
<text x="692" y="584" font-size="13.5" fill="#141414">Approved plan sent to ERP, EAM</text>
<text x="692" y="602" font-size="13.5" fill="#141414">and WMS</text>
<circle cx="683" cy="615.5" r="2.2" fill="#141414"/>
<text x="692" y="620" font-size="13.5" fill="#141414">Approval reference on every</text>
<text x="692" y="638" font-size="13.5" fill="#141414">handoff</text>
<circle cx="683" cy="651.5" r="2.2" fill="#141414"/>
<text x="692" y="656" font-size="13.5" fill="#141414">Acknowledgements tracked</text>
<rect x="666" y="706" width="268" height="30" fill="#141414"/>
<text x="800.0" y="726" text-anchor="middle" font-size="13" font-weight="700" fill="#FFDD00">Step 5 · enterprise handoff</text>
<rect x="368" y="500" width="268" height="236" fill="#FFFFFF" stroke="#141414" stroke-width="1.6"/>
<text x="380" y="524" font-size="13.5" font-weight="700" fill="#141414">ENTERPRISE SYSTEMS</text>
<text x="380" y="556" font-size="17.5" font-weight="700" fill="#141414">7–9. Create work,</text>
<text x="380" y="578" font-size="17.5" font-weight="700" fill="#141414">repair, return outcome</text>
