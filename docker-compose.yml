# Full-stack POC (docs/plan-fullstack-poc.md).  Start with:  docker compose up --build
# web http://localhost:5173 · di-api http://localhost:8000/docs · source-sim http://localhost:8100/docs
# Host ports from the environment or .env (container ports stay fixed): WEB_PORT (5173), API_PORT (8000), SIM_PORT
# (8100), SFTP_PORT (2222), POSTGRES_PORT (5432); BIND_ADDR (127.0.0.1) is the host address they bind to.
# DEV_POLLING=1 makes the reloaders poll for file changes (bind mounts that deliver no events: a Windows drive, some
# VMs), DEV_POLLING=0 never; unset, they poll only under a WSL2 kernel (watchfiles' default; frontend/vite.config.ts).

x-pg: &pg
  POSTGRES_USER: ${POSTGRES_USER:-circ}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-circ}

x-api-env: &api-env
  DI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-circ}:${POSTGRES_PASSWORD:-circ}@postgres:5432/di
  DI_SOURCE_SIM_URL: http://source-sim:8100
  # B13b, the real loop: follow source-sim's simulated clock, and send approved steps to the mocked systems
  # (the test suite pins the clock and turns sending off for itself: backend/tests/conftest.py)
  DI_CLOCK: sim
  DI_INSTRUCTIONS: "true"
  # D2: dev, test or prod; outside dev the api refuses the shipped signing secrets (empty secrets = the dev defaults)
  DI_ENV: ${DI_ENV:-dev}
  DI_JWT_SECRET: ${DI_JWT_SECRET:-}
  DI_WEBHOOK_SECRET: ${DI_WEBHOOK_SECRET:-}
  DI_SECRET_KEY: ${DI_SECRET_KEY:-}
  # B16b, Ask Circularity on a language model (di/services/ask): the key stays in the repository's local .env (git-ignored);
  # without it, or with ASK_PROVIDER=none, Ask answers with the demo's rule-based fallback
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  ASK_PROVIDER: ${ASK_PROVIDER:-groq}
  GROQ_MODEL: ${GROQ_MODEL:-}

services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      <<: *pg
      POSTGRES_DB: postgres
    ports: ["${BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # over TCP, so it only passes once the init scripts have run and the real server is up
      test: ["CMD-SHELL", "export PGPASSWORD=$${POSTGRES_PASSWORD}; psql -h 127.0.0.1 -U $${POSTGRES_USER} -d di -tAc 'select 1' && psql -h 127.0.0.1 -U $${POSTGRES_USER} -d sources -tAc 'select 1'"]
      interval: 3s
      timeout: 3s
      retries: 30

  source-sim:
    restart: unless-stopped
    build: { context: ./source-sim, target: dev } # runtime target: docker-compose.prod.yml
    environment:
      SIM_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-circ}:${POSTGRES_PASSWORD:-circ}@postgres:5432/sources
      DEV_POLLING: ${DEV_POLLING:-}
    # DEV_POLLING 1/0 -> watchfiles' WATCHFILES_FORCE_POLLING true/false (unset: its own default, polling only on WSL2)
    command: >-
      sh -c 'case "$${DEV_POLLING}" in 1|true) export WATCHFILES_FORCE_POLLING=true ;; 0|false) export WATCHFILES_FORCE_POLLING=false ;; esac;
      exec uvicorn sim.main:app --host 0.0.0.0 --port 8100 --reload'
    volumes:
      - ./source-sim:/app
      - ./fixtures:/fixtures:ro # B1 golden files: the seed (docs/backend-steps.md, B2)
      - ./ruff.toml:/ruff.toml:ro # the shared ruff config the service's pyproject extends (../../ruff.toml)
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${SIM_PORT:-8100}:8100"
      - "${BIND_ADDR:-127.0.0.1}:${SFTP_PORT:-2222}:2222" # SFTP: the Sims Lifecycle Services drop (B5b)
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    restart: unless-stopped
    build: { context: ./backend, target: dev } # runtime target: docker-compose.prod.yml
    environment:
      <<: *api-env
      DEV_POLLING: ${DEV_POLLING:-}
    # DEV_POLLING 1/0 -> watchfiles' WATCHFILES_FORCE_POLLING true/false (unset: its own default, polling only on WSL2)
    # --timeout-graceful-shutdown 3: a reload closes open connections after 3 s; without it uvicorn waits for the
    # browser's live stream (SSE, never ends by itself) and the api hangs "waiting for connections to close"
    command: >-
      sh -c 'case "$${DEV_POLLING}" in 1|true) export WATCHFILES_FORCE_POLLING=true ;; 0|false) export WATCHFILES_FORCE_POLLING=false ;; esac;
      alembic upgrade head && exec uvicorn di.main:app --host 0.0.0.0 --port 8000 --reload --timeout-graceful-shutdown 3'
    volumes:
      - ./backend:/app
      - ./fixtures:/fixtures:ro # B1 golden files: access policy and reference data (B7)
      - ./ruff.toml:/ruff.toml:ro # the shared ruff config the service's pyproject extends (../../ruff.toml)
    ports: ["${BIND_ADDR:-127.0.0.1}:${API_PORT:-8000}:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      source-sim: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    restart: unless-stopped
    build: { context: ./backend, target: dev } # runtime target: docker-compose.prod.yml
    environment: *api-env
    command: python -m di.worker
    volumes:
      - ./backend:/app
      - ./fixtures:/fixtures:ro
    depends_on:
      api: { condition: service_healthy }   # api runs the migrations first
      source-sim: { condition: service_healthy }
    healthcheck:
      # liveness only: the worker serves no port, so check that PID 1 is still the worker process (python:slim has no
      # ps/pgrep). If the loop dies the container exits and `restart` brings it back.
      test: ["CMD", "python", "-c", "import sys;sys.exit(b'di.worker' not in open('/proc/1/cmdline','rb').read())"]
      interval: 10s
      timeout: 3s
      retries: 3

  web:
    restart: unless-stopped
    build: { context: ./frontend, target: dev } # runtime target: docker-compose.prod.yml
    environment:
      API_PROXY_TARGET: http://api:8000
      VITE_BACKEND: ${VITE_BACKEND:-api} # the app reads di-api (B17)
      LEGACY_HTML: /legacy/index.html
      # polling for file changes: vite.config.ts reads DEV_POLLING (no CHOKIDAR_USEPOLLING: it would override that)
      DEV_POLLING: ${DEV_POLLING:-}
    ports: ["${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-5173}:5173"]
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
      # the static demo supplies the stylesheet and product photos (frontend/scripts/extract-styles.mjs reads /legacy/index.html)
      - ./fixtures/demo/index.html:/legacy/index.html:ro
      - ./fixtures/demo/assets:/legacy/assets:ro
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      # 127.0.0.1, not localhost: Vite listens on IPv4 (0.0.0.0) and alpine may resolve localhost to ::1
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  pgdata:
  web_node_modules:
