# pre-commit hooks (docs/agents/plans/01b-refactor.md, step C5). Install once: `pre-commit install`.
# The ruff rev matches the ruff pin in apps/api/requirements-dev.txt and apps/source-sim/requirements.txt;
# the root ruff.toml holds the ruff settings, which each service's pyproject.toml extends.
# fixtures/ is excluded from the text fixers: the golden files are compared byte for byte (parity).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        files: ^apps/(api|source-sim)/
      - id: ruff-format
        files: ^apps/(api|source-sim)/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^fixtures/
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^fixtures/
