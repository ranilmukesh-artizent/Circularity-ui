# Weekly dependency updates; minor and patch bumps arrive grouped, one PR per ecosystem and directory.
version: 2

updates:
  - package-ecosystem: pip
    directories: ["/apps/api", "/apps/source-sim"]
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: ["/apps/api", "/apps/source-sim", "/apps/web"]
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
