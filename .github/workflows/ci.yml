# CI (docs/agents/plans/01b-refactor.md, step C5; docs/agents/testing.md, "CI").
# Needs no repository secret: without GROQ_API_KEY, Ask answers with the demo's rule-based fallback.
# Every third-party action and image is pinned by full commit SHA / digest, with its version in a comment
# (Dependabot keeps them current: .github/dependabot.yml).
name: CI

on:
  pull_request:
  push:
    branches: ["main", "feature/fullstack-poc"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The api and source-sim suites inside their containers, as scripts/dev/full-suite.sh runs them.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The worker stays down (full-suite.sh stops it: tests/test_milestone_rt1048.py needs it stopped) and the web
      # app has its own job. --wait returns once every started service's healthcheck passes (step F1).
      - name: Start postgres, source-sim and api
        run: docker compose up -d --build --wait --wait-timeout 300 postgres source-sim api

      - name: Show the stack on failure
        if: ${{ failure() }}
        run: docker compose ps

      - name: Reset the simulator
        run: |
          docker compose stop worker
          curl -fsS -X POST http://localhost:8100/_sim/reset >/dev/null

      - name: api import contracts (apps/api/.importlinter)
        run: docker compose exec -T api lint-imports

      - name: api suite
        timeout-minutes: 60
        run: docker compose exec -T api pytest -q -p no:cacheprovider -rfE

      - name: source-sim suite
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: docker compose exec -T source-sim pytest -q -p no:cacheprovider -rfE

      - name: Service logs on failure
        if: ${{ failure() }}
        run: docker compose logs --no-color --tail=300 postgres source-sim api

      - name: Stop the stack
        if: ${{ always() }}
        run: docker compose down -v

  # arm64 (plan 01b, step G5): the whole stack (postgres, source-sim, api, worker, web) built and started from the
  # dev compose file on an arm64 runner, then health checks and one signed-in screen read through the web app's
  # proxy. Deliberately light: the test suites run on amd64 in `stack`; this job proves the images build and the
  # services start and answer on arm64 (Apple Silicon, ARM Linux).
  # `ubuntu-24.04-arm` is one of GitHub's hosted arm64 runners: free for public repositories; a private repository
  # needs a plan that includes arm64 runners, otherwise this job waits for a runner and never starts.
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      WEB: http://localhost:5173
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the whole stack
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Architecture
        run: |
          echo "runner: $(uname -m); api container: $(docker compose exec -T api uname -m)"
          test "$(docker compose exec -T api uname -m)" = aarch64

      - name: Health checks
        run: |
          curl -fsS -m 10 http://localhost:8000/api/health | grep -q '"status":"ok"'
          curl -fsS -m 10 -o /dev/null http://localhost:8100/health
          test "$(curl -sS -m 30 -o /dev/null -w '%{http_code}' "$WEB/")" = 200

      - name: Sign in and read a screen through the web app
        run: |
          token=$(curl -fsS -m 30 -X POST "$WEB/api/auth/login" -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"demo"}' | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
          test -n "$token"
          curl -fsS -m 60 -H "Authorization: Bearer $token" "$WEB/api/screens/case/RT-1048" | grep -q '"RT-1048"'

      - name: Service logs on failure
        if: ${{ failure() }}
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

      - name: Stop the stack
        if: ${{ always() }}
        run: docker compose down -v

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run knip

  python-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [api, source-sim]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements*.lock
            apps/source-sim/requirements*.lock
      # ruff at the version the service's dev lock pins
      - name: Install ruff and pip-audit
        run: |
          ruff_pin=$(grep -hoE '^ruff==[^ ]+' requirements-dev.lock | head -n 1)
          test -n "$ruff_pin"
          python -m pip install "$ruff_pin" "pip-audit==2.10.1"
      - run: ruff check .
      - run: ruff format --check .
      # mypy (api only; config in apps/api/pyproject.toml): it checks against the packages the code imports, so it
      # installs both locks, hash-checked, as the image does; mypy itself is pinned in the dev lock.
      - name: mypy
        if: ${{ matrix.app == 'api' }}
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock -r requirements-dev.lock
          mypy
      - run: pip-audit --progress-spinner off --require-hashes --disable-pip -r requirements.lock

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks binary from its image (pinned by digest; v8.30.1), so no gitleaks-action licence key is needed.
      # Pull requests: only the PR's commits. Pushes: the full history.
      - name: gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          range=()
          if [ -n "$BASE_SHA" ]; then range=("--log-opts=$BASE_SHA..$HEAD_SHA"); fi
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --verbose --no-banner "${range[@]}" /repo
