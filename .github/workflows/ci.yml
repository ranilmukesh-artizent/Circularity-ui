# CI (docs/agents/plans/01b-refactor.md, step C5; docs/agents/testing.md, "CI").
# Needs no repository secret: without GROQ_API_KEY, Ask answers with the demo's rule-based fallback.
# Every third-party action and image is pinned by full commit SHA / digest, with its version in a comment
# (Dependabot keeps them current: .github/dependabot.yml).
name: CI

on:
  pull_request:
  push:
    branches: ["main", "feature/fullstack-poc"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The api and source-sim suites inside their containers, as scripts/dev/full-suite.sh runs them.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The worker stays down (full-suite.sh stops it: tests/test_milestone_rt1048.py needs it stopped) and the web
      # app has its own job. TODO(F1): `docker compose up -d --build --wait` once every service has a healthcheck.
      - name: Start postgres, source-sim and api
        run: docker compose up -d --build postgres source-sim api

      - name: Wait for api and source-sim
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8000/api/health >/dev/null && curl -fsS http://localhost:8100/health >/dev/null; then
              echo "healthy after ~$((i * 2))s"; exit 0
            fi
            sleep 2
          done
          echo "api or source-sim did not become healthy"; docker compose ps; exit 1

      - name: Reset the simulator
        run: |
          docker compose stop worker
          curl -fsS -X POST http://localhost:8100/_sim/reset >/dev/null

      - name: api suite
        timeout-minutes: 60
        run: docker compose exec -T api pytest -q -p no:cacheprovider -rfE

      - name: source-sim suite
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: docker compose exec -T source-sim pytest -q -p no:cacheprovider -rfE

      - name: Service logs on failure
        if: ${{ failure() }}
        run: docker compose logs --no-color --tail=300 postgres source-sim api

      - name: Stop the stack
        if: ${{ always() }}
        run: docker compose down -v

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      # TODO(C2): ESLint and knip once the web lint config lands.
      # - run: npm run lint
      # - run: npx knip

  python-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [api, source-sim]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements*.lock
            apps/source-sim/requirements*.lock
      # ruff at the version the service's dev lock pins
      - name: Install ruff and pip-audit
        run: |
          ruff_pin=$(grep -hoE '^ruff==[^ ]+' requirements-dev.lock | head -n 1)
          test -n "$ruff_pin"
          python -m pip install "$ruff_pin" "pip-audit==2.10.1"
      - run: ruff check .
      # TODO(C1): ruff format check once the code is formatted.
      # - run: ruff format --check .
      # TODO(C3): mypy once its config lands.
      # - run: mypy
      - run: pip-audit --progress-spinner off --require-hashes --disable-pip -r requirements.lock

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks binary from its image (pinned by digest; v8.30.1), so no gitleaks-action licence key is needed.
      # Pull requests: only the PR's commits. Pushes: the full history.
      - name: gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          range=()
          if [ -n "$BASE_SHA" ]; then range=("--log-opts=$BASE_SHA..$HEAD_SHA"); fi
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --verbose --no-banner "${range[@]}" /repo
