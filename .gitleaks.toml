# gitleaks: the default rules, plus one allowlist for the synthetic credentials the source-sim mocks use (AWS IoT
# Core demo IAM users, apps/source-sim/sim/vendors/aws_iot). They are documented demo values, not secrets.
[extend]
useDefault = true

[allowlist]
description = "source-sim synthetic demo credentials"
regexes = ['''AKIACIRCULARITY[A-Z0-9]{5}''']
